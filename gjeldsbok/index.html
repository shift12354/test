<title>Gjeldsbok</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#F5F4F8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0B0A0F" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Nunito:wght@600;700;800&display=swap">
<style>
/* Layout: iOS-inspirert app i én kolonne. Glass bare i navigasjonslaget (fanelinje, knapper, ark), grupperte lister for innholdet. Alt som dukker opp, kommer fra bunnen. */
@property --glow { syntax: "<number>"; inherits: true; initial-value: 0; }
:root {
  --bg: #F5F4F8;
  --cell: #FFFFFF;
  --label: #16141C;
  --label2: #6B6875;
  --label3: #8E8A99;
  --sep: #DAD7E0;
  --fill: rgba(120, 112, 140, 0.14);
  --fill2: rgba(120, 112, 140, 0.08);
  --accent: #6E56CF;
  --accent-text: #5B45BC;
  --on-accent: #FFFFFF;
  --pos: #2FB57E;
  --pos-text: #18805A;
  --neg: #E5484D;
  --neg-text: #C9343A;
  --glass-tint: rgba(255, 255, 255, 0.36);
  --sheet-tint: rgba(250, 249, 253, 0.74);
  --glass-solid: rgba(250, 249, 253, 0.92);
  --glass-rim: rgba(255, 255, 255, 0.95);
  --glass-rim2: rgba(255, 255, 255, 0.22);
  --glass-sheen: rgba(255, 255, 255, 0.22);
  --glass-edge: rgba(255, 255, 255, 0.16);
  --glass-shadow: 0 12px 32px rgba(40, 30, 80, 0.14), 0 2px 6px rgba(40, 30, 80, 0.08);
  --scrim: rgba(20, 16, 30, 0.25);
  --amb1: rgba(110, 86, 207, 0.20);
  --amb2: rgba(47, 181, 126, 0.12);
  --amb3: rgba(229, 72, 77, 0.07);
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro", "Inter", system-ui, "Segoe UI", Roboto, sans-serif;
  --font-round: ui-rounded, "SF Pro Rounded", "Nunito", -apple-system, system-ui, sans-serif;
  --spring: cubic-bezier(0.34, 1.45, 0.64, 1);
  --sheet: cubic-bezier(0.32, 0.72, 0, 1);
  --ease: cubic-bezier(0.25, 0.8, 0.25, 1);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0B0A0F; --cell: #1A1820; --label: #F4F2F8; --label2: #A09CAB; --label3: #6F6B7A; --sep: #2E2B36;
    --fill: rgba(140, 130, 170, 0.24); --fill2: rgba(140, 130, 170, 0.12);
    --accent: #9B87F5; --accent-text: #B3A4FA; --on-accent: #0B0A0F;
    --pos: #3DD68C; --pos-text: #3DD68C; --neg: #FF6369; --neg-text: #FF7A7F;
    --glass-tint: rgba(40, 36, 54, 0.42); --sheet-tint: rgba(28, 26, 36, 0.78); --glass-solid: rgba(30, 28, 38, 0.94); --glass-rim: rgba(255, 255, 255, 0.38); --glass-rim2: rgba(255, 255, 255, 0.05);
    --glass-sheen: rgba(255, 255, 255, 0.07); --glass-edge: rgba(255, 255, 255, 0.07);
    --glass-shadow: 0 12px 32px rgba(0, 0, 0, 0.55), 0 2px 6px rgba(0, 0, 0, 0.4); --scrim: rgba(0, 0, 0, 0.5);
    --amb1: rgba(155, 135, 245, 0.20); --amb2: rgba(61, 214, 140, 0.09); --amb3: rgba(255, 99, 105, 0.06);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0B0A0F; --cell: #1A1820; --label: #F4F2F8; --label2: #A09CAB; --label3: #6F6B7A; --sep: #2E2B36;
  --fill: rgba(140, 130, 170, 0.24); --fill2: rgba(140, 130, 170, 0.12);
  --accent: #9B87F5; --accent-text: #B3A4FA; --on-accent: #0B0A0F;
  --pos: #3DD68C; --pos-text: #3DD68C; --neg: #FF6369; --neg-text: #FF7A7F;
  --glass-tint: rgba(40, 36, 54, 0.42); --sheet-tint: rgba(28, 26, 36, 0.78); --glass-solid: rgba(30, 28, 38, 0.94); --glass-rim: rgba(255, 255, 255, 0.38); --glass-rim2: rgba(255, 255, 255, 0.05);
  --glass-sheen: rgba(255, 255, 255, 0.07); --glass-edge: rgba(255, 255, 255, 0.07);
  --glass-shadow: 0 12px 32px rgba(0, 0, 0, 0.55), 0 2px 6px rgba(0, 0, 0, 0.4); --scrim: rgba(0, 0, 0, 0.5);
  --amb1: rgba(155, 135, 245, 0.20); --amb2: rgba(61, 214, 140, 0.09); --amb3: rgba(255, 99, 105, 0.06);
  color-scheme: dark;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { background: var(--bg); }
body { color: var(--label); font-family: var(--font); font-size: 17px; line-height: 22px; letter-spacing: -0.41px; -webkit-font-smoothing: antialiased; -webkit-text-size-adjust: 100%; }
button, input, select { font: inherit; color: inherit; letter-spacing: inherit; }
button { cursor: pointer; border: 0; background: none; padding: 0; -webkit-user-select: none; user-select: none; }
:focus-visible { outline: 3px solid color-mix(in srgb, var(--accent) 60%, transparent); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }
.pos { color: var(--pos-text); }
.neg { color: var(--neg-text); }
.acc { color: var(--accent-text); }
.sec { color: var(--label2); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.ambient { position: fixed; inset: 0; z-index: -1; pointer-events: none;
  background:
    radial-gradient(70% 45% at 10% -5%, var(--amb1), transparent 70%),
    radial-gradient(55% 35% at 105% 12%, var(--amb2), transparent 70%),
    radial-gradient(60% 40% at 90% 105%, var(--amb1), transparent 70%),
    radial-gradient(45% 30% at 0% 95%, var(--amb3), transparent 70%),
    var(--bg); }

/* ---------- Liquid Glass ----------
   Lag (samme i Safari på iPhone og i andre nettlesere):
   ::before  uskarphet + metning av det som ligger bak, tone, glans øverst, lysende kant innerst og et lys som følger fingeren
   ::after   lyskant (spekulær) som er sterkest øverst til venstre og nederst til høyre
   selve elementet  myk skygge under */
.glass { position: relative; isolation: isolate; background: transparent; box-shadow: var(--glass-shadow); --gx: 50%; --gy: 0%; transition: --glow 0.35s var(--ease); }
.glass::before {
  content: ""; position: absolute; inset: 0; z-index: -1; border-radius: inherit; pointer-events: none;
  -webkit-backdrop-filter: blur(10px) saturate(185%) brightness(1.04);
  backdrop-filter: blur(10px) saturate(185%) brightness(1.04);
  background:
    radial-gradient(circle at var(--gx) var(--gy), rgba(255, 255, 255, calc(var(--glow) * 0.45)), transparent 60%),
    radial-gradient(farthest-side, transparent 74%, var(--glass-edge)),
    linear-gradient(180deg, var(--glass-sheen), transparent 48%),
    var(--glass-tint);
}
.glass::after {
  content: ""; position: absolute; inset: 0; z-index: -1; border-radius: inherit; pointer-events: none; padding: 1px;
  background: linear-gradient(135deg, var(--glass-rim), var(--glass-rim2) 38%, var(--glass-rim2) 62%, var(--glass-rim));
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  -webkit-mask-composite: xor; mask-composite: exclude;
}
.glass.lit { --glow: 1; }
.frost { --glass-tint: var(--sheet-tint); }
.frost::before { -webkit-backdrop-filter: blur(24px) saturate(190%) brightness(1.03); backdrop-filter: blur(24px) saturate(190%) brightness(1.03); }
.glass.tint { --glass-tint: color-mix(in srgb, var(--accent) 88%, transparent); --glass-sheen: rgba(255, 255, 255, 0.25); color: var(--on-accent); box-shadow: 0 10px 24px color-mix(in srgb, var(--accent) 38%, transparent); }
.press { transition: transform 0.4s var(--spring), --glow 0.35s var(--ease); }
.press:active { transform: scale(0.92); }
@media (prefers-reduced-transparency: reduce) {
  .glass::before { -webkit-backdrop-filter: none; backdrop-filter: none; background: var(--glass-solid); }
  .glass.tint::before { background: var(--accent); }
}
@media (prefers-contrast: more) {
  .glass::before { -webkit-backdrop-filter: none; backdrop-filter: none; background: var(--cell); }
  .glass::after { background: var(--label); }
}

.circle { width: 48px; height: 48px; border-radius: 50%; display: grid; place-items: center; flex: none; }
.circle svg { width: 20px; height: 20px; }
.circle:disabled { opacity: 0.5; }
.capsule-btn { height: 48px; border-radius: 999px; display: inline-flex; align-items: center; gap: 2px; padding: 0 18px 0 12px; font-weight: 500; }
.capsule-btn svg { width: 20px; height: 20px; }

/* ---------- Ramme ---------- */
.app { max-width: 680px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0; }
.view { padding-top: 64px; padding-bottom: calc(140px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 12px; outline: none; }
.view.enter > * { animation: rowIn 0.55s var(--spring) both; animation-delay: calc(var(--i, 0) * 32ms); }
@keyframes rowIn { from { opacity: 0; transform: translateY(14px) scale(0.985); } }
.large { margin: 4px 0; font-size: 34px; line-height: 41px; font-weight: 700; letter-spacing: 0.37px; overflow-wrap: anywhere; text-wrap: balance; }

.edge-top, .edge-bottom { -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); }
.edge-top { -webkit-mask-image: linear-gradient(#000 55%, transparent); mask-image: linear-gradient(#000 55%, transparent); }
.edge-bottom { -webkit-mask-image: linear-gradient(transparent, #000 60%); mask-image: linear-gradient(transparent, #000 60%); }
.edge-top { position: fixed; z-index: 8; top: 0; left: 0; right: 0; height: calc(env(safe-area-inset-top, 0px) + 60px); pointer-events: none; background: linear-gradient(color-mix(in srgb, var(--bg) 85%, transparent) 40%, color-mix(in srgb, var(--bg) 0%, transparent)); }
.edge-bottom { position: fixed; z-index: 8; bottom: 0; left: 0; right: 0; height: calc(env(safe-area-inset-bottom, 0px) + 110px); pointer-events: none; background: linear-gradient(color-mix(in srgb, var(--bg) 0%, transparent), color-mix(in srgb, var(--bg) 70%, transparent)); }
.navbar { position: fixed; z-index: 9; top: env(safe-area-inset-top, 0px); left: 0; right: 0; height: 60px; pointer-events: none; }
.navbar-in { max-width: 680px; margin: 0 auto; height: 100%; display: flex; align-items: center; gap: 12px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.navbar-in > * { pointer-events: auto; }
.navtitle { flex: 1; text-align: center; font-weight: 600; opacity: 0; transform: translateY(6px); transition: opacity 0.2s, transform 0.3s var(--ease); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; pointer-events: none !important; }
.navtitle.show { opacity: 1; transform: none; }
.navslot { min-width: 48px; display: flex; flex: none; }
.navslot.end { justify-content: flex-end; }

/* ---------- Fanelinje ---------- */
.dock { position: fixed; z-index: 10; left: 0; right: 0; bottom: calc(env(safe-area-inset-bottom, 0px) + 16px); pointer-events: none; }
.dock-in { max-width: 680px; margin: 0 auto; display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)); }
.dock-in > * { pointer-events: auto; }
.tabbar { display: grid; grid-template-columns: repeat(3, minmax(0, 84px)); padding: 4px; border-radius: 999px; min-width: 0; }
.tab { position: relative; z-index: 1; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 7px 0 6px; border-radius: 999px; font-size: 10px; line-height: 12px; font-weight: 600; letter-spacing: 0.1px; color: var(--label); transition: color 0.25s; }
.tab svg { width: 25px; height: 25px; }
.tab[aria-current="page"] { color: var(--accent-text); }
.pill { position: absolute; z-index: 0; top: 4px; left: 4px; width: calc((100% - 8px) / 3); bottom: 4px; border-radius: 999px; background: var(--fill); transition: transform 0.55s var(--spring), scale 0.3s var(--ease); }
.pill.stretch { scale: 1.22 0.9; }
.plusbtn { width: 62px; height: 62px; border-radius: 50%; display: grid; place-items: center; flex: none; }
.plusbtn svg { width: 24px; height: 24px; }
.plusbtn:disabled { opacity: 0.5; }

/* ---------- Innhold ---------- */
.card { background: var(--cell); border-radius: 26px; padding: 18px 20px 20px; display: flex; flex-direction: column; gap: 14px; }
.cap { font-size: 15px; line-height: 20px; font-weight: 500; color: var(--label2); letter-spacing: -0.24px; }
.big { display: flex; align-items: baseline; flex-wrap: wrap; column-gap: 3px; font-family: var(--font-round); font-weight: 700; letter-spacing: -0.5px; }
.big .i { font-size: clamp(40px, 13vw, 52px); line-height: 1.12; font-variant-numeric: tabular-nums; }
.big .d { font-size: 24px; font-weight: 600; font-variant-numeric: tabular-nums; }
.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.tile { background: var(--fill2); border-radius: 18px; padding: 10px 14px; min-width: 0; }
.tile span { display: flex; align-items: center; gap: 6px; font-size: 13px; line-height: 18px; color: var(--label2); letter-spacing: -0.08px; }
.tile span::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--dot); flex: none; }
.tile b { display: block; font-family: var(--font-round); font-size: 20px; line-height: 26px; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: 0; }
.head { display: flex; align-items: baseline; gap: 12px; padding: 10px 4px 0; }
.head h2 { flex: 1; margin: 0; font-size: 22px; line-height: 28px; font-weight: 700; letter-spacing: 0.35px; }
.head button, .linkbtn { color: var(--accent-text); font-weight: 500; }
.dayhead { padding: 10px 4px 0; margin: 0; font-size: 15px; line-height: 20px; font-weight: 600; color: var(--label2); letter-spacing: -0.24px; }
.footer { padding: 0 16px; margin: 0; font-size: 13px; line-height: 18px; color: var(--label2); letter-spacing: -0.08px; }
.stack { display: flex; flex-direction: column; gap: 12px; }

.group { background: var(--cell); border-radius: 26px; overflow: hidden; }
.row { display: flex; align-items: center; gap: 12px; padding-left: 16px; width: 100%; text-align: left; background: var(--cell); transition: background 0.2s; }
button.row:active, button.row[aria-current="true"] { background: color-mix(in srgb, var(--label) 6%, var(--cell)); }
.cell { flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px; padding: 11px 16px 11px 0; border-bottom: 0.5px solid var(--sep); min-height: 62px; }
.group > :last-child .cell { border-bottom: 0; }
.txt { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
.t { overflow-wrap: anywhere; }
.sub { font-size: 15px; line-height: 20px; color: var(--label2); letter-spacing: -0.24px; overflow-wrap: anywhere; }
.meta { font-size: 13px; line-height: 18px; color: var(--label3); letter-spacing: -0.08px; }
.amt { display: flex; flex-direction: column; align-items: flex-end; gap: 1px; flex: none; }
.amt b { font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
.amt small { font-size: 13px; line-height: 18px; color: var(--label3); letter-spacing: -0.08px; }
.void .t, .void .amt b { text-decoration: line-through; color: var(--label2); }
.void .av { filter: grayscale(1); opacity: 0.5; }
.av { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; flex: none; color: #fff; font-family: var(--font-round); font-weight: 700; font-size: 15px; letter-spacing: 0; background: linear-gradient(160deg, var(--a1), var(--a2)); box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.35); }
.av.xl { width: 56px; height: 56px; font-size: 20px; }
.chev { width: 14px; height: 14px; color: var(--label3); flex: none; display: grid; }
.chev svg { width: 14px; height: 14px; }
.person .t { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.searchf { display: flex; align-items: center; gap: 6px; background: var(--fill); border-radius: 999px; padding: 0 12px; }
.searchf svg { width: 17px; height: 17px; color: var(--label2); flex: none; }
.searchf input { flex: 1; min-width: 0; border: 0; background: transparent; outline: none; padding: 9px 0; font-size: 17px; -webkit-appearance: none; appearance: none; }
.searchf:focus-within { box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 40%, transparent); }
.seg { position: relative; display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; padding: 2px; border-radius: 999px; background: var(--fill); }
.seg button { position: relative; z-index: 1; padding: 7px 6px; border-radius: 999px; font-size: 14px; line-height: 18px; font-weight: 500; letter-spacing: -0.15px; min-width: 0; overflow-wrap: anywhere; }
.seg button[aria-checked="true"] { font-weight: 600; }
.seg .thumb { position: absolute; z-index: 0; top: 2px; bottom: 2px; left: 2px; border-radius: 999px; background: var(--cell); box-shadow: 0 3px 8px rgba(30, 20, 60, 0.12), 0 0 0 0.5px rgba(30, 20, 60, 0.05); transition: transform 0.5s var(--spring), scale 0.25s var(--ease); }
.seg .thumb.stretch { scale: 1.08 0.94; }
.filters { display: flex; flex-wrap: wrap; gap: 8px; }
.pick { position: relative; display: inline-flex; align-items: center; background: var(--cell); border-radius: 999px; color: var(--accent-text); font-weight: 500; font-size: 15px; letter-spacing: -0.24px; max-width: 100%; }
.pick select { appearance: none; -webkit-appearance: none; border: 0; background: transparent; color: inherit; padding: 7px 30px 7px 14px; border-radius: 999px; max-width: 100%; font-size: 15px; font-weight: 500; }
.pick svg { position: absolute; right: 11px; width: 12px; height: 12px; pointer-events: none; }
.btns { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.fillbtn { display: inline-flex; justify-content: center; align-items: center; min-height: 50px; padding: 0 16px; border-radius: 999px; background: var(--fill); font-weight: 600; color: var(--accent-text); transition: transform 0.4s var(--spring), background 0.2s; }
.fillbtn:active { transform: scale(0.96); }
.fillbtn.danger { color: var(--neg-text); }
.fillbtn.prominent { background: var(--accent); color: var(--on-accent); }
.fillbtn:disabled { opacity: 0.4; cursor: not-allowed; }
.empty { background: var(--cell); border-radius: 26px; padding: 22px 20px; display: flex; flex-direction: column; gap: 10px; }
.empty h3 { margin: 0; font-size: 20px; line-height: 25px; font-weight: 600; letter-spacing: 0.38px; }
.empty p { margin: 0; font-size: 15px; line-height: 20px; color: var(--label2); letter-spacing: -0.24px; }
.notice { background: var(--cell); border-radius: 20px; padding: 14px 16px; font-size: 15px; line-height: 20px; letter-spacing: -0.24px; }
.skel { height: 64px; border-radius: 26px; background: var(--cell); position: relative; overflow: hidden; }
.skel::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, transparent, var(--fill2), transparent); animation: sh 1.3s infinite; }
@keyframes sh { from { transform: translateX(-100%); } to { transform: translateX(100%); } }
.inline { display: flex; gap: 14px; padding: 10px 16px; align-items: center; }
.inline input { flex: 1; min-width: 0; border: 0; outline: none; background: transparent; padding: 6px 0; font-size: 17px; }

/* ---------- Toppfelt på Oversikt (etter Framer-designet) ---------- */
:root { --hero: linear-gradient(165deg, #241552 0%, #5B44C4 48%, #2A9D7A 100%); --hero-glow: rgba(155, 135, 245, 0.55); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --hero: linear-gradient(165deg, #0F0828 0%, #3B2B8E 50%, #136049 100%); --hero-glow: rgba(120, 100, 230, 0.45); } }
:root[data-theme="dark"] { --hero: linear-gradient(165deg, #0F0828 0%, #3B2B8E 50%, #136049 100%); --hero-glow: rgba(120, 100, 230, 0.45); }
.view.has-hero { padding-top: 0; }
.hero { position: relative; overflow: hidden; color: #fff; background: var(--hero);
  margin-left: calc(-1 * max(16px, env(safe-area-inset-left, 0px))); margin-right: calc(-1 * max(16px, env(safe-area-inset-right, 0px)));
  padding: calc(env(safe-area-inset-top, 0px) + 22px) max(20px, env(safe-area-inset-right, 0px)) 72px max(20px, env(safe-area-inset-left, 0px));
  border-radius: 0 0 34px 34px; display: flex; flex-direction: column; gap: 18px; }
@media (min-width: 712px) { .hero { margin-left: 0; margin-right: 0; margin-top: 12px; border-radius: 34px; } }
.hero::before { content: ""; position: absolute; width: 280px; height: 280px; top: -90px; right: -90px; border-radius: 50%; background: var(--hero-glow); filter: blur(50px); pointer-events: none; }
.hero::after { content: ""; position: absolute; width: 220px; height: 220px; bottom: -110px; left: -60px; border-radius: 50%; background: rgba(61, 214, 140, 0.35); filter: blur(60px); pointer-events: none; }
.hero > * { position: relative; z-index: 1; }
.hero-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.hero h1 { margin: 0; font-size: 30px; line-height: 36px; font-weight: 700; letter-spacing: 0.2px; }
.eyebrow { font-size: 12px; line-height: 16px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: rgba(255, 255, 255, 0.72); }
.hero .big { color: #fff; }
.hero .big .i { font-size: clamp(48px, 15vw, 60px); line-height: 1.05; }
.hero .big .d { color: rgba(255, 255, 255, 0.85); }
.hero-sub { font-size: 15px; line-height: 20px; color: rgba(255, 255, 255, 0.78); letter-spacing: -0.24px; }
.bars { display: grid; grid-template-columns: repeat(8, 1fr); gap: 6px; align-items: end; height: 46px; }

dialog.full { width: 100%; max-width: 560px; height: calc(100dvh - env(safe-area-inset-top, 0px) - 10px); max-height: 900px; margin: auto auto 0; }

<script>
(() => {
  "use strict";

  /* ---------- Ikoner (standardsymboler) ---------- */
  const svg = (p, w = 2) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${p}</svg>`;
  const fillSvg = (p) => `<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">${p}</svg>`;
  const I = {
    house: fillSvg('<path d="M11.3 2.7a1.1 1.1 0 0 1 1.4 0l8.2 7.1c.4.3.6.8.6 1.3V20a1.6 1.6 0 0 1-1.6 1.6H15v-5.8c0-.6-.4-1-1-1h-4c-.6 0-1 .4-1 1v5.8H4.1A1.6 1.6 0 0 1 2.5 20v-8.9c0-.5.2-1 .6-1.3z"/>'),
    people: fillSvg('<circle cx="9" cy="7.6" r="3.7"/><path d="M2.4 19.6c0-3.4 3-5.8 6.6-5.8s6.6 2.4 6.6 5.8c0 .6-.4 1-1 1H3.4c-.6 0-1-.4-1-1z"/><circle cx="16.8" cy="8.6" r="2.9" opacity=".6"/><path d="M17.2 14.1c2.8.2 4.6 2.1 4.6 4.8 0 .5-.3.8-.8.8h-3.6c.1-2-.3-3.9-1.6-5.4z" opacity=".6"/>'),
    list: fillSvg('<circle cx="4.5" cy="6" r="1.7"/><circle cx="4.5" cy="12" r="1.7"/><circle cx="4.5" cy="18" r="1.7"/><rect x="8.5" y="5" width="13" height="2" rx="1"/><rect x="8.5" y="11" width="13" height="2" rx="1"/><rect x="8.5" y="17" width="13" height="2" rx="1"/>'),
    plus: svg('<path d="M5 12h14"/><path d="M12 5v14"/>', 2.6),
    inn: svg('<path d="M17 7 7 17"/><path d="M17 17H7V7"/>', 2.4),
    ut: svg('<path d="M7 7h10v10"/><path d="M7 17 17 7"/>', 2.4),
    chev: svg('<path d="m9 18 6-6-6-6"/>', 2.8),
    back: svg('<path d="m15 18-6-6 6-6"/>', 2.6),
    x: svg('<path d="M18 6 6 18"/><path d="m6 6 12 12"/>', 2.5),
    check: svg('<path d="M20 6 9 17l-5-5"/>', 2.8),
    search: svg('<circle cx="11" cy="11" r="7.5"/><path d="m20.5 20.5-4.2-4.2"/>', 2.4),
    updown: svg('<path d="m7 15 5 5 5-5"/><path d="m7 9 5-5 5 5"/>', 2.8),
  };

  /* ---------- Formatering ---------- */
  const TZ = "Europe/Oslo";
  const nf = new Intl.NumberFormat("nb-NO", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const nf0 = new Intl.NumberFormat("nb-NO", { maximumFractionDigits: 0 });
  const kr = (ore) => nf.format(Math.abs(ore) / 100);
  const krShort = (ore) => (Math.abs(ore) % 100 === 0 ? nf0.format(Math.abs(ore) / 100) : nf.format(Math.abs(ore) / 100)) + " kr";
  const splitKr = (ore) => { const s = kr(ore); const i = s.lastIndexOf(","); return [s.slice(0, i), s.slice(i) + " kr"]; };
  const dtf = new Intl.DateTimeFormat("nb-NO", { timeZone: TZ, weekday: "short", day: "2-digit", month: "2-digit", year: "numeric", hour: "2-digit", minute: "2-digit", hourCycle: "h23" });
  const dayFmt = new Intl.DateTimeFormat("nb-NO", { timeZone: TZ, weekday: "long", day: "numeric", month: "long" });
  const dayFmtY = new Intl.DateTimeFormat("nb-NO", { timeZone: TZ, weekday: "long", day: "numeric", month: "long", year: "numeric" });
  const parts = (d) => { const o = {}; for (const p of dtf.formatToParts(d)) o[p.type] = p.value; return o; };
  const stamp = (iso) => { const p = parts(new Date(iso)); return `${p.weekday} ${p.day}.${p.month}.${p.year} · ${p.hour}.${p.minute}`; };
  const clock = (iso) => { const p = parts(new Date(iso)); return `${p.hour}.${p.minute}`; };
  const dayKey = (d) => { const p = parts(d); return `${p.year}-${p.month}-${p.day}`; };
  const shortDate = (iso) => { const p = parts(new Date(iso)); return `${p.day}.${p.month}.`; };
  const relDay = (iso) => {
    const d = new Date(iso), k = dayKey(d), now = new Date();
    if (k === dayKey(now)) return "I dag";
    if (k === dayKey(new Date(now.getTime() - 864e5))) return "I går";
    const s = (parts(d).year === parts(now).year ? dayFmt : dayFmtY).format(d);
    return s.charAt(0).toUpperCase() + s.slice(1);
  };
  const shortStamp = (iso) => { const r = relDay(iso); return (r === "I dag" || r === "I går") ? `${r} ${clock(iso)}` : `${shortDate(iso)}${parts(new Date(iso)).year}`; };
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const initials = (n) => (n || "?").trim().split(/\s+/).slice(0, 2).map((w) => w[0]).join("").toUpperCase();
  const firstName = (n) => (n || "personen").trim().split(/\s+/)[0];
  const AV = [["#A796F7", "#6E56CF"], ["#5FD3A6", "#1F9D6B"], ["#F7A97A", "#DF6E3B"], ["#7DBEF7", "#3B7FD4"], ["#F58BB4", "#CF4A82"], ["#C9B27A", "#93783E"]];
  const avColor = (id) => { let h = 0; for (const c of String(id)) h = (h * 31 + c.charCodeAt(0)) >>> 0; return AV[h % AV.length]; };
  const avatar = (id, name, cls = "") => { const [a, b] = avColor(id); return `<span class="av ${cls}" style="--a1:${a};--a2:${b}" aria-hidden="true">${esc(initials(name))}</span>`; };

  function parseAmount(raw) {
    let s = String(raw || "").replace(/[\s ]/g, "").replace(/kr/gi, "");
    s = s.replace(/\.(?=\d{3}(\D|$))/g, "").replace(",", ".");
    if (!/^\d+(\.\d{1,2})?$/.test(s)) return null;
    const ore = Math.round(parseFloat(s) * 100);
    return ore > 0 ? ore : null;
  }
  const oreToInput = (ore) => (ore / 100).toFixed(2).replace(".", ",").replace(/,00$/, "");
  const METHODS = { vipps: "Vipps", bank: "Bank", kontant: "Kontant", annet: "Annet" };

  /* ---------- Regnskapsregler ----------
     Positiv saldo = personen skylder meg.
     Gjeld inn (+) · Gjeld ut (−) · Overføring ut (+) · Overføring inn (−) */
  const effect = (e) => (e.kind === "debt" ? (e.dir === "in" ? 1 : -1) : (e.dir === "out" ? 1 : -1)) * e.amountOre;
  const title = (e, n) => e.kind === "debt"
    ? (e.dir === "in" ? `${n} skylder meg` : `Jeg skylder ${n}`)
    : (e.dir === "in" ? `${n} betalte meg` : `Jeg betalte ${n}`);
  const amtLabel = (e) => e.kind === "debt" ? (e.dir === "in" ? "til gode" : "skylder") : (e.dir === "in" ? "mottatt" : "sendt");
  const effectText = (e, n) => e.kind === "debt"
    ? (e.dir === "in" ? `Gjeld · ${n} skylder deg dette` : `Gjeld · du skylder ${n} dette`)
    : (e.dir === "in" ? `Overføring inn · teller som betaling fra ${n}` : `Overføring ut · ${n} skylder deg mer`);

  /* ---------- Tilstand ---------- */
  const S = {
    db: null, canWrite: false, ready: false, status: "loading", banner: "",
    people: new Map(), entries: [],
    tab: "oversikt", personView: null,
    f: { type: "all", person: "", period: "all", q: "" },
    sel: null, confirmVoid: false, renaming: false, busy: false, form: null,
  };
  const $ = (id) => document.getElementById(id);
  const personName = (id) => S.people.get(id)?.name || "Ukjent person";
  const sortedPeople = () => [...S.people.values()].sort((a, c) => a.name.localeCompare(c.name, "nb"));
  const blocked = () => S.status === "denied" || S.status === "offline";

  function balances() {
    const b = new Map(), n = new Map(), last = new Map();
    for (const p of S.people.keys()) { b.set(p, 0); n.set(p, 0); }
    for (const e of S.entries) {
      n.set(e.personId, (n.get(e.personId) || 0) + 1);
      if (!last.has(e.personId)) last.set(e.personId, e.loggedAt);
      if (e.status !== "void") b.set(e.personId, (b.get(e.personId) || 0) + effect(e));
    }
    return { b, n, last };
  }

  function trend(n) {
    const now = Date.now(), out = [];
    for (let w = n - 1; w >= 0; w--) {
      const cut = now - w * 7 * 864e5; let sum = 0;
      for (const e of S.entries) if (e.status !== "void" && new Date(e.loggedAt).getTime() <= cut) sum += effect(e);
      out.push(sum);
    }
    return out;
  }

  /* ---------- Byggeklosser ---------- */
  function rowHTML(e, o = {}) {
    const n = personName(e.personId), void_ = e.status === "void";
    const cls = e.kind === "debt" ? (e.dir === "in" ? "pos" : "neg") : "";
    const sign = e.kind === "debt" ? (e.dir === "in" ? "+" : "−") : "";
    const edited = (e.history || []).some((h) => h.action === "edited");
    const kind = e.kind === "debt" ? "Gjeld" : "Overføring" + (e.method ? " · " + (METHODS[e.method] || e.method) : "");
    const when = o.timeOnly ? clock(e.loggedAt) : shortStamp(e.loggedAt);
    const meta = [kind, when, edited ? "Redigert" : "", void_ ? "Annullert" : ""].filter(Boolean).join(" · ");
    return `<button type="button" class="row${void_ ? " void" : ""}" data-entry="${esc(e.id)}" aria-current="${S.sel === e.id}">
      ${avatar(e.personId, n)}
      <span class="cell"><span class="txt"><span class="t">${esc(title(e, n))}</span><span class="sub">${esc(e.reason)}</span><span class="meta">${esc(meta)}</span></span>
      <span class="amt"><b class="${void_ ? "" : cls}">${sign}${kr(e.amountOre)} kr</b><small>${amtLabel(e)}</small></span></span></button>`;
  }
  function personRow(p, B) {
    const v = B.b.get(p.id) || 0, cnt = B.n.get(p.id) || 0;
    const cls = v > 0 ? "pos" : v < 0 ? "neg" : "sec";
    const lab = v > 0 ? "skylder deg" : v < 0 ? "du skylder" : "gjort opp";
    const sub = `${cnt} ${cnt === 1 ? "post" : "poster"}${B.last.has(p.id) ? " · " + shortDate(B.last.get(p.id)) : ""}`;
    return `<button type="button" class="row person" data-person="${esc(p.id)}">
      ${avatar(p.id, p.name)}
      <span class="cell"><span class="txt"><span class="t">${esc(p.name)}</span><span class="meta">${esc(sub)}</span></span>
      <span class="amt"><b class="${cls}">${krShort(v)}</b><small>${lab}</small></span><span class="chev">${I.chev}</span></span></button>`;
  }
  const big = (ore, cls, key) => { const [i, d] = splitKr(ore); return `<div class="big ${cls}" ${key ? `data-count="${ore}" data-key="${esc(key)}"` : ""}><span class="i">${ore < 0 ? "−" : ""}${i}</span><span class="d">${d}</span></div>`; };
  const skel = (n) => Array.from({ length: n }, () => '<div class="skel"></div>').join("");
  function dayGroups(list) {
    const groups = [];
    for (const e of list) {
      const k = dayKey(new Date(e.loggedAt));

  /* ---------- Gjengivelse ---------- */
  let lastKey = "";
  const shown = new Map();
  function render() {
    const key = S.personView ? "person:" + S.personView : S.tab;
    const v = $("view");
    if (key === "logg" && lastKey === "logg" && $("logList")) {
      const fp = $("fPerson"); if (fp) { fp.innerHTML = personOptions(); fp.value = S.f.person; }
      v.querySelector(".notice")?.remove();
      const n = notice(); if (n) $("largeTitle").insertAdjacentHTML("afterend", n);
    } else {
      v.innerHTML = S.personView ? vPerson() : S.tab === "personer" ? vPersoner() : S.tab === "logg" ? vLogg() : vOversikt();
      if (key !== lastKey) {
        [...v.children].forEach((c, i) => c.style.setProperty("--i", Math.min(i, 12)));
        v.classList.remove("enter"); void v.offsetWidth; v.classList.add("enter");
      }
    }
    lastKey = key;
    const heroView = key === "oversikt";
    v.classList.toggle("has-hero", heroView); document.body.classList.toggle("hero-view", heroView);
    renderLogList();
    renderChrome();
    renderDetail();
    observeTitle();
    animateCounts();
  }
  function animateCounts() {
    const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
    document.querySelectorAll("[data-count]").forEach((el) => {
      const to = Number(el.dataset.count), k = el.dataset.key, from = shown.has(k) ? shown.get(k) : 0;
      shown.set(k, to);
      if (from === to || reduce) return;
      const t0 = performance.now(), dur = 700;
      const step = (t) => {
        const p = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - p, 3), val = Math.round(from + (to - from) * e);
        const [i, d] = splitKr(val);
        const ie = el.querySelector(".i"), de = el.querySelector(".d");
        if (!ie || !el.isConnected) return;
        ie.textContent = (val < 0 ? "−" : "") + i; de.textContent = d;
        if (p < 1) requestAnimationFrame(step);
      };
      requestAnimationFrame(step);
    });
  }
  let pillIdx = 0;
  function renderChrome() {
    const tabs = ["oversikt", "personer", "logg"], idx = tabs.indexOf(S.tab);
    document.querySelectorAll(".tab").forEach((b) => b.setAttribute("aria-current", b.dataset.tab === S.tab ? "page" : "false"));
    const pill = $("pill");
    if (idx !== pillIdx) { pill.classList.add("stretch"); setTimeout(() => pill.classList.remove("stretch"), 220); pillIdx = idx; }
    pill.style.transform = `translateX(${idx * 100}%)`;
    $("navStart").innerHTML = S.personView ? `<button class="capsule-btn glass press" type="button" data-act="back">${I.back}<span>Personer</span></button>` : "";
    $("navTitle").textContent = S.personView ? personName(S.personView) : { oversikt: "Gjeldsbok", personer: "Personer", logg: "Logg" }[S.tab];
    $("plus").disabled = !S.canWrite;
  }
  let io, observed = null;
  function observeTitle() {
    const t = $("largeTitle");
    if (t === observed) return;
    io?.disconnect(); observed = t;
    if (!t || !("IntersectionObserver" in window)) return;
    io = new IntersectionObserver(([en]) => { $("navTitle").classList.toggle("show", !en.isIntersecting); document.body.classList.toggle("past-title", !en.isIntersecting); }, { rootMargin: "-56px 0px 0px 0px" });
    io.observe(t);
  }

  /* ---------- Ark: åpne, lukke, dra ned ---------- */
  function openSheet(d) { if (!d.open) { d.classList.remove("closing"); d.style.transform = ""; d.showModal(); } }
  function closeSheet(d, after) {
    if (!d.open || d.classList.contains("closing")) return;
    d.classList.add("closing");
    setTimeout(() => { d.close(); d.classList.remove("closing"); d.style.transform = ""; d.style.transition = ""; after?.(); }, 290);
  }
  function enableDrag(d, onClose) {
    let y0 = null, dy = 0, t0 = 0;
    d.addEventListener("pointerdown", (e) => {
      if (!e.target.closest("[data-drag]") || e.target.closest("button, input, select")) return;
      y0 = e.clientY; dy = 0; t0 = performance.now(); d.style.transition = "none";
      try { d.setPointerCapture(e.pointerId); } catch {}
    });
    d.addEventListener("pointermove", (e) => {
      if (y0 == null) return;
      const raw = e.clientY - y0; dy = raw > 0 ? raw : -Math.sqrt(-raw) * 2;
      d.style.transform = `translateY(${dy}px)`;
    });
    const end = () => {
      if (y0 == null) return;
      const v = dy / Math.max(1, performance.now() - t0); y0 = null;
      d.style.transition = "transform 0.45s var(--sheet)";
      if (dy > 120 || (dy > 30 && v > 0.5)) onClose(); else d.style.transform = "";
    };
    d.addEventListener("pointerup", end); d.addEventListener("pointercancel", end);
  }
  const closeDetail = () => closeSheet($("detailDlg"), () => { S.sel = null; S.confirmVoid = false; renderSel(); });
  const closeForm = () => closeSheet($("formDlg"), () => { if (!S.busy) S.form = null; });
  const closeAct = () => closeSheet($("actDlg"));
  for (const [id, fn] of [["detailDlg", closeDetail], ["formDlg", closeForm], ["actDlg", closeAct]]) {
    const d = $(id);
    d.addEventListener("cancel", (e) => { e.preventDefault(); fn(); });
    d.addEventListener("click", (e) => { if (e.target === d) fn(); });
    enableDrag(d, fn);
  }
  const renderSel = () => document.querySelectorAll("[data-entry]").forEach((b) => b.setAttribute("aria-current", b.dataset.entry === S.sel));

  /* ---------- Post-ark ---------- */
  const FIELD_LABEL = { amountOre: "Sum", reason: "Grunn", personId: "Person", kind: "Type", dir: "Retning", method: "Betalt med" };
  function fmtField(f, v) {

      ${F.personId === "__new" ? `<div class="group"><label class="formrow"><span>Navn</span><input id="newName" placeholder="For eksempel Ola Hansen" maxlength="60" autocomplete="off" autocapitalize="words" value="${esc(F.newName)}"></label></div>` : ""}
      ${segHTML("dir", [["in", dIn], ["out", dOut]], F.dir)}
      <div class="amountcard"><label for="amt">Beløp</label><div class="amountrow"><input id="amt" inputmode="decimal" autocomplete="off" placeholder="0" value="${esc(F.amount)}"><span>kr</span></div></div>
      <div class="group">
        <label class="formrow"><span>Grunn</span><input id="reason" maxlength="140" autocomplete="off" autocapitalize="sentences" placeholder="${isT ? "Tilbakebetaling" : "Pizza fredag"}" value="${esc(F.reason)}"></label>
        ${isT ? `<label class="formrow"><span>Betalt med</span><select id="method">${Object.entries(METHODS).map(([k, v]) => `<option value="${k}" ${F.method === k ? "selected" : ""}>${v}</option>`).join("")}</select>${I.updown}</label>` : ""}
      </div>
      <p class="err" role="alert">${esc(F.err)}</p>
      <p class="footer">${F.mode === "edit"
        ? `Dato for posten: ${stamp(F.loggedAt)}. Endringen lagres i historikken med dato og klokkeslett.`
        : `Dato og klokkeslett settes automatisk når du lagrer: <span id="clock" class="num">${stamp(new Date().toISOString())}</span>.${isT ? " Lånte du bort penger med Vipps, holder det å føre én overføring ut. Da skylder personen deg beløpet." : ""}`}</p>
      <button class="fillbtn prominent" type="submit" ${S.busy ? "disabled" : ""}>${F.mode === "edit" ? "Lagre endring" : isT ? "Loggfør overføring" : "Loggfør gjeld"}</button>`;
    $("form").scrollTop = sc;
    sizeAmount();
  }
  async function submitForm() {
    readForm();
    const F = S.form, db = S.db; if (!F || !db || S.busy) return;
    const amountOre = parseAmount(F.amount), reason = F.reason.trim(), newName = F.newName.trim();
    let err = "";
    if (!F.personId) err = "Velg hvem posten gjelder.";
    else if (F.personId === "__new" && !newName) err = "Skriv navnet på den nye personen.";
    else if (amountOre == null) err = "Skriv et beløp større enn 0, for eksempel 450 eller 1 250,50.";
    else if (!reason) err = "Skriv en grunn, så du husker hva posten gjaldt.";
    if (err) { F.err = err; renderForm(); return; }
    S.busy = true; renderForm();
    try {
      let personId = F.personId;
      if (personId === "__new") {
        const ex = [...S.people.values()].find((p) => p.name.toLowerCase() === newName.toLowerCase());
        if (ex) personId = ex.id;
        else { const ref = db.collection("people").doc(); await ref.set({ name: newName, createdAt: new Date().toISOString() }); personId = ref.id; }
      }
      const data = { kind: F.kind, dir: F.dir, personId, amountOre, reason, method: F.kind === "transfer" ? F.method : null };
      const now = new Date().toISOString();
      if (F.mode === "new") {
        await db.collection("entries").doc().set({ ...data, loggedAt: now, status: "active", history: [{ at: now, action: "created", snapshot: { amountOre, reason } }] });
        toast(F.kind === "debt" ? "Gjeld loggført" : "Overføring loggført");
      } else {
        const cur = S.entries.find((x) => x.id === F.id), changes = {};
        for (const k of Object.keys(data)) if ((cur[k] ?? null) !== (data[k] ?? null)) changes[k] = [cur[k] ?? null, data[k] ?? null];
        if (Object.keys(changes).length) {
          await db.doc("entries/" + F.id).update({ ...data, history: [...(cur.history || []), { at: now, action: "edited", changes }] });
          toast("Endring lagret");
        }
      }
      S.busy = false; closeForm(); render();
    } catch (e) {
      S.busy = false;
      F.err = e?.code === "quota_exceeded" ? "Gjeldsboken er full." : "Kunne ikke lagre. Sjekk nettet og prøv igjen.";
      renderForm();
    }
  }
  async function setStatusOf(id, status, action) {
    const e = S.entries.find((x) => x.id === id); if (!e || S.busy) return;
    S.busy = true; renderDetail();
    try {
      const now = new Date().toISOString();
      await S.db.doc("entries/" + id).update({ status, history: [...(e.history || []), { at: now, action }] });
      toast(action === "voided" ? "Posten er annullert" : "Posten er gjenopprettet");
    } catch { toast("Kunne ikke lagre. Prøv igjen."); }
    S.busy = false; S.confirmVoid = false; render();
  }
  async function renamePerson() {
    const id = S.personView, name = $("renameIn")?.value.trim();
    if (!id || !name || S.busy) return;
    S.busy = true;
    try { await S.db.doc("people/" + id).update({ name }); toast("Navnet er endret"); S.renaming = false; }
    catch { toast("Kunne ikke lagre navnet."); }
    S.busy = false; render();
  }

  let toastT;
  function toast(msg) {
    $("toastHost").innerHTML = `<div class="toast glass frost" role="status">${esc(msg)}</div>`;
    clearTimeout(toastT);
    toastT = setTimeout(() => { const t = $("toastHost").firstElementChild; if (!t) return; t.classList.add("out"); setTimeout(() => t.remove(), 300); }, 2200);
  }

  /* ---------- Lys som følger fingeren på glasset ---------- */
  document.addEventListener("pointerdown", (e) => {
    const g = e.target.closest(".glass.press"); if (!g) return;
    const r = g.getBoundingClientRect();
    g.style.setProperty("--gx", ((e.clientX - r.left) / r.width * 100) + "%");
    g.style.setProperty("--gy", ((e.clientY - r.top) / r.height * 100) + "%");
    g.classList.add("lit");
    const off = () => { g.classList.remove("lit"); window.removeEventListener("pointerup", off); window.removeEventListener("pointercancel", off); };
    window.addEventListener("pointerup", off); window.addEventListener("pointercancel", off);
  }, { passive: true });

  /* ---------- Hendelser ---------- */
  document.addEventListener("click", (ev) => {
    const t = ev.target.closest("button"); if (!t) return;
    if (t.id === "plus") { if (S.canWrite) openSheet($("actDlg")); return; }
    if (t.dataset.quick) { const [k, d] = t.dataset.quick.split(":"); openForm(k, null, d); return; }
    if (t.dataset.new) { const k = t.dataset.new; if ($("actDlg").open) closeSheet($("actDlg"), () => openForm(k)); else openForm(k); return; }
    if (t.dataset.tab) { if (S.tab === t.dataset.tab && !S.personView) { window.scrollTo({ top: 0, behavior: "smooth" }); return; } S.tab = t.dataset.tab; S.personView = null; S.renaming = false; window.scrollTo({ top: 0 }); render(); return; }
    if (t.dataset.person) { S.personView = t.dataset.person; S.renaming = false; window.scrollTo({ top: 0 }); render(); return; }
    if (t.dataset.entry) { S.sel = t.dataset.entry; S.confirmVoid = false; renderSel(); renderDetail(); return; }
    if (t.dataset.seg) {
      const name = t.dataset.seg, v = t.dataset.v, seg = t.parentElement, bs = [...seg.querySelectorAll("button")], th = seg.querySelector(".thumb");
      th.classList.add("stretch"); setTimeout(() => th.classList.remove("stretch"), 200);
      if (name === "type") {
        S.f.type = v; bs.forEach((b) => b.setAttribute("aria-checked", b === t));
        th.style.transform = `translateX(${bs.indexOf(t) * 100}%)`;
        renderLogList(); return;
      }
      if (S.form) {
        readForm(); S.form[name] = v; S.form.err = "";
        bs.forEach((b) => b.setAttribute("aria-checked", b === t)); th.style.transform = `translateX(${bs.indexOf(t) * 100}%)`;
        if (name === "kind") setTimeout(renderForm, 260);
        return;
      }
    }
    if (t.dataset.f && S.form) {
      readForm(); S.form[t.dataset.f] = t.dataset.v; S.form.err = ""; renderForm();
      if (t.dataset.v === "__new") $("newName")?.focus();
      return;
    }
    switch (t.dataset.act) {
      case "close-act": closeAct(); break;
      case "close-form": closeForm(); break;
      case "close-detail": closeDetail(); break;
      case "edit": { const id = S.sel; closeSheet($("detailDlg"), () => { S.sel = null; S.confirmVoid = false; renderSel(); openForm(null, id); }); break; }
      case "void": S.confirmVoid = true; renderDetail(); break;
      case "void-no": S.confirmVoid = false; renderDetail(); break;
      case "void-yes": setStatusOf(S.sel, "void", "voided"); break;
      case "restore": setStatusOf(S.sel, "active", "restored"); break;
      case "back": S.personView = null; S.renaming = false; render(); break;
      case "rename": S.renaming = true; render(); $("renameIn")?.focus(); break;
      case "rename-cancel": S.renaming = false; render(); break;
      case "rename-save": renamePerson(); break;
    }
  });
  document.addEventListener("input", (ev) => {
    const id = ev.target.id;
    if (id === "q") { S.f.q = ev.target.value; renderLogList(); }
    else if (id === "amt") sizeAmount();
    else if (id === "newName" && S.form) {
      S.form.newName = ev.target.value;
      const b = $("form").querySelectorAll('[data-seg="dir"]'), [a, c] = dirLabels();
      if (b.length === 2) { b[0].textContent = a; b[1].textContent = c; }
    }
  });
  document.addEventListener("change", (ev) => {
    if (ev.target.id === "fPerson") { S.f.person = ev.target.value; renderLogList(); }
    if (ev.target.id === "fPeriod") { S.f.period = ev.target.value; renderLogList(); }
  });
  document.addEventListener("keydown", (ev) => { if (ev.key === "Enter" && ev.target.id === "renameIn") renamePerson(); });
  $("form").addEventListener("submit", (ev) => { ev.preventDefault(); submitForm(); });

  /* ---------- Oppstart ---------- */
  const TAB_LABEL = { oversikt: "Oversikt", personer: "Personer", logg: "Logg" };
  const TAB_ICON = { oversikt: I.house, personer: I.people, logg: I.list };
  document.querySelectorAll(".tab").forEach((b) => { b.innerHTML = TAB_ICON[b.dataset.tab] + `<span>${TAB_LABEL[b.dataset.tab]}</span>`; });
  $("plus").innerHTML = I.plus;
  setInterval(() => { const c = $("clock"); if (c) c.textContent = stamp(new Date().toISOString()); }, 15000);
  render();

  (async () => {
    if (!window.claude || typeof window.claude.use !== "function") { S.status = "offline"; S.banner = "offline"; render(); return; }
    const [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
    if (!db) { S.status = "offline"; S.banner = "offline"; render(); return; }
    const owner = user ? await user.isOwner() : null;
    if (owner === false) { S.status = "denied"; S.banner = "denied"; render(); return; }
    S.db = db; S.canWrite = true; render();
    let gotP = false, gotE = false; const ok = { p: false, e: false };
    const timer = setTimeout(() => { if (!(ok.p && ok.e)) { S.banner = "slow"; render(); } }, 10000);
    const settle = () => {
      if (gotP && gotE) { S.ready = true; S.status = "ok"; }
      if (ok.p && ok.e) { clearTimeout(timer); if (S.banner === "slow") S.banner = ""; }
      render();
    };
    const onErr = (e) => { clearTimeout(timer); S.ready = true; if (e?.code === "revoked") { S.canWrite = false; S.banner = "denied"; } else S.banner = "error"; render(); };
    db.collection("people").onSnapshot((s) => {
      const m = new Map(); for (const d of s.docs) m.set(d.id, { id: d.id, ...d.data() });
      S.people = m; gotP = true; if (!s.metadata.fromCache) ok.p = true; settle();
    }, onErr);
    db.collection("entries").orderBy("loggedAt", "desc").onSnapshot((s) => {
      S.entries = s.docs.map((d) => ({ id: d.id, ...d.data() }));
      gotE = true; if (!s.metadata.fromCache) ok.e = true;
      if (S.sel && !S.entries.some((x) => x.id === S.sel)) S.sel = null;
      settle();
    }, onErr);
  })();
})();
</script>
